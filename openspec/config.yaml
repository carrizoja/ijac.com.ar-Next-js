schema: spec-driven

context: |
  Next.js 16.2.4 + React 19.2.5 + TypeScript 5 static-export site.
  Tailwind CSS v4, shadcn/ui new-york style, lucide icons.
  Dark theme by default with an opt-in light mode (.dark class on <html>, see src/app/lib/theme.ts).
  Output: 'export' to out/; deployed to Hostinger as static files.
  No API routes, Server Actions, middleware, or ISR.
  npm workspaces: packages/* and chat-api (Vercel serverless AI chat API).
  Site locale es_AR; agent artifacts remain English per AGENTS.md/CLAUDE.md.
  Path alias @/* -> ./src/*; components live in src/app/components/ and src/app/components/ui/.
  Bilingual: Spanish at unprefixed URLs, English under /en, both statically exported.
  No i18n library; localization is hand-rolled in src/i18n/ (routing helpers plus
  per-locale copy modules). availableEnglishPaths in src/i18n/routing.ts is the
  switch that promotes a nav item from a home anchor to a real translated page.

projects:
  - path: "."
    stack: "Next.js 16.2.4 + React 19.2.5 + TypeScript 5 + Tailwind CSS v4"
    test_command: "npm test"
    framework: vitest
  - path: "chat-api"
    stack: "Vercel serverless TypeScript API (Zod, Groq SDK)"
    test_command: "npm test"
    framework: vitest
  - path: "packages/contracts"
    stack: "Shared Zod schemas"
    test_command: "npm test"
    framework: vitest
  - path: "packages/knowledge"
    stack: "RAG/knowledge retriever"
    test_command: "npm test"
    framework: vitest

rules:
  proposal:
    - Include rollback plan for risky changes
    - Respect static-export constraints (no server runtime)
    - Keep both locales in step: a new route needs its /en counterpart or an explicit reason it has none
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Site copy is Spanish; artifacts remain English
    - Cover metadata, structured data, sitemap, and routing impacts for each locale
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Prefer client components for interactivity; no server actions
    - Evaluate i18n approach against static-export and Hostinger constraints
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Update tests or add new ones before implementation when in TDD mode
  apply:
    guidelines:
      - Follow existing code patterns
      - Keep components in src/app/components unless the surrounding style uses @/* aliases
      - Maintain Spanish site copy and accessibility labels unless explicitly localizing
      - Preserve existing uncommitted implementation work
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    typecheck_command: "npx tsc --noEmit"
    lint_command: "npm run lint"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Preserve existing domain specs when merging deltas

testing:
  strict_tdd: true
  runner: vitest
  test_command: "npm test"
  typecheck_command: "npx tsc --noEmit"
  build_command: "npm run build"
  lint_command: "npm run lint"
  layers:
    unit: true
    integration: true
    e2e: false
  coverage: false
  formatter: false
